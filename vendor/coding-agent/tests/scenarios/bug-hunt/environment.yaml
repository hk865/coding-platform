# MiniMart 环境与预算
scenario: bug-hunt
title: 项目 Bug 排查：修复 MiniMart 订单与库存服务
runtime: node >= 24
dependencies: none
tools: read, edit, shell, check
permissions:
  sandbox_mode: workspace_only
  approval_policy: on_request
budget:
  max_model_requests: 200
  max_tool_calls: 400
  max_input_tokens: 200000
  deadline_minutes: 60
evaluation:
  layers: L2
  metrics: total_time, model_rounds, tool_calls, tokens, session_size, workspace_scan_cost
