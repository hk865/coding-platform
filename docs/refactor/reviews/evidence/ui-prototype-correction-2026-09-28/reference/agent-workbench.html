<div id="quiet-workbench" data-panel-open="false" data-expanded="false" aria-label="简洁版 Agent 工作台原型">
<header class="q-top"><button class="q-icon cursor-interaction" id="q-nav" aria-label="展开或收起项目导航"><i data-lucide="panel-left" aria-hidden="true"></i></button><strong>coding-platform</strong><span class="q-fill"></span><span class="q-demo-label">示例</span><nav class="q-right-tools" aria-label="右侧资料与工具"><button class="q-icon cursor-interaction" data-panel="tasks" aria-label="打开任务图"><i data-lucide="git-branch" aria-hidden="true"></i></button><button class="q-icon cursor-interaction" data-panel="architecture" aria-label="打开架构图"><i data-lucide="network" aria-hidden="true"></i></button><button class="q-icon cursor-interaction" data-panel="files" aria-label="打开文件资源管理器"><i data-lucide="file-text" aria-hidden="true"></i></button><button class="q-icon cursor-interaction" data-panel="terminal" aria-label="打开终端输出"><i data-lucide="terminal" aria-hidden="true"></i></button></nav><button class="q-icon cursor-interaction" id="q-toggle-panel" aria-label="显示或隐藏右侧工作区" aria-expanded="false"><i data-lucide="panel-right" aria-hidden="true"></i></button><button class="q-icon cursor-interaction" id="q-theme" aria-label="切换明暗主题"><i data-lucide="sun-moon" aria-hidden="true"></i></button></header>
<div class="q-body">
<aside class="q-side" aria-label="项目与 Agent"><div class="q-section">项目</div><button class="q-project cursor-interaction" id="q-project" aria-expanded="true"><i data-lucide="chevron-down" aria-hidden="true"></i>coding-platform</button><div class="q-people" id="q-people"><button class="q-person cursor-interaction" data-agent="main" aria-pressed="true">主对话</button><button class="q-person cursor-interaction" data-agent="impl" aria-pressed="false"><span class="q-dot running"></span>实现者</button><button class="q-person cursor-interaction" data-agent="review" aria-pressed="false"><span class="q-dot idle"></span>审阅者</button><button class="q-person cursor-interaction" data-agent="architect" aria-pressed="false"><span class="q-dot idle"></span>架构参谋</button></div><button class="q-archive cursor-interaction" id="q-archive" aria-expanded="false">已归档</button><div id="q-archived" hidden><button class="q-person cursor-interaction" data-agent="old">调查者</button></div></aside>
<main class="q-center"><div class="q-titlebar"><button class="cursor-interaction" id="q-title" aria-expanded="false">主对话</button><span class="q-fill"></span><button class="q-icon cursor-interaction" id="q-more" aria-label="更多会话操作" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div><div class="q-menu" id="q-menu" hidden><button class="cursor-interaction" data-mode="chat">对话</button><button class="cursor-interaction" data-mode="observe">行为观察</button><button class="cursor-interaction" data-panel="architecture">架构图</button></div><div class="q-drawer" id="q-role" hidden></div><div class="q-chat" id="q-chat"></div><div class="q-compose-wrap"><form class="q-compose" id="q-compose"><textarea id="q-input" aria-label="消息" placeholder="发送消息…"></textarea><div class="q-compose-bottom"><span id="q-recipient">主对话</span><span class="q-fill"></span><button class="q-send q-icon cursor-interaction" type="submit" aria-label="发送示例消息"><i data-lucide="arrow-up" aria-hidden="true"></i></button></div></form><div class="q-status" id="q-status" role="status" aria-live="polite"></div></div></main>
<aside class="q-panel" id="q-panel" aria-label="辅助工作区" hidden><div class="q-panelhead"><div class="q-pages" id="q-pages" aria-label="辅助工作区页面"></div><button class="q-icon cursor-interaction" id="q-new-page" aria-label="新建页面"><i data-lucide="plus" aria-hidden="true"></i></button><span class="q-fill"></span><button class="q-icon cursor-interaction" id="q-expand" aria-label="放大辅助视图" aria-pressed="false"><i data-lucide="maximize-2" aria-hidden="true"></i></button><button class="q-icon cursor-interaction" id="q-close" aria-label="隐藏右侧工作区"><i data-lucide="panel-right-close" aria-hidden="true"></i></button></div><div id="q-panelcontent"></div><div class="q-detail" id="q-detail" hidden></div></aside>
</div></div>
<script>
(()=>{
const root=document.getElementById('quiet-workbench'),$=s=>root.querySelector(s);
const state={agent:'main',mode:'chat',panel:'tasks',open:false,expanded:false,theme:'dark',treeSize:12,pages:[],activePage:null};
const names={main:'主对话',impl:'实现者',review:'审阅者',architect:'架构参谋',old:'调查者'};
const drafts={},messages={},pageViews={};let renderedPage=null,renderedKind=null;let pageCounter=0;const pageNames={tasks:'任务图',architecture:'架构图',files:'资源管理器',file:'文件',terminal:'终端',blank:'新页面'};let currentKey='',foldOpen=false;
const details={goal:['首条 E2E 路径','目标 · 推进中','完成依据来自当前采用的义务与真实检查。'],behavior:['行为与验收','已完成 · 文档','查看已明确的行为要求与验收场景。'],completion:['检查与完成链','工作中 · 实现者','检查尚未全部结束，当前不代表任务已完成。'],entry:['入口与结果展示','待细化 · 必需','未来工作仍保留在任务图中，尚未开始。'],verify:['端到端核对','待命 · 审阅者','在产物和检查结果可核对后开展。'],workflow:['Workflow','已采用模块','规划、Session 选择与下一步业务动作。'],runtime:['AgentRuntime','已采用模块','实际执行、控制与真实观察。'],graph:['WorkGraph','已采用模块','任务、关联、证据与正式状态。'],workspace:['WorkspaceTools','已采用模块','文件、来源捕获与比较。'],store:['RecordStore','已采用模块','条件事务与持久化。']};
function icon(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
let lastSavedState='';
function save(){const snapshot={modelContent:{uiDirection:'传统 Session + 渐进披露 + 树状节点，无常驻卡片',theme:state.theme,auxiliaryOpen:state.open},privateContent:{agent:state.agent,mode:state.mode,panel:state.panel,expanded:state.expanded,treeSize:state.treeSize,pages:state.pages,activePage:state.activePage,leftWidth:state.leftWidth,rightWidth:state.rightWidth,groupTasks:state.groupTasks}};lastSavedState=JSON.stringify(snapshot);if(window.openai?.setWidgetState)window.openai.setWidgetState(snapshot).catch(()=>{});}
function role(){const desc=state.agent==='main'?'需求讨论、协作安排与结果解释。':state.agent==='impl'?'编码执行 · 工作中。当前负责检查与完成链。':state.agent==='review'?'独立审阅 · 待命。当前没有执行占用。':state.agent==='architect'?'架构咨询 · 待命。负责方案与模块边界。':'历史调查 · 已归档。记录保留，当前只读。';$('#q-role').textContent=names[state.agent]+' — '+desc;}
function baseRenderChat(){if(currentKey)drafts[currentKey]=$('#q-input').value;currentKey=state.agent;$('#q-input').value=drafts[currentKey]||'';$('#q-title').textContent=names[state.agent]+(state.mode==='observe'?' · 行为观察':'');$('#q-recipient').textContent=names[state.agent];$('#q-compose').hidden=state.mode==='observe'||state.agent==='old';root.querySelectorAll('[data-agent]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.agent===state.agent)));role();let html='';
if(state.mode==='observe'){html='<div class="q-subtle" style="margin-bottom:28px">当前 Session 的明确动作与结果</div><div class="q-event">读取完成条件<small>14:32 · MVP-BEHAVIOR.md</small></div><div class="q-event">更新完成归约入口<small>14:33 · completion.ts</small></div><div class="q-event">运行相关检查<small>14:34 · 等待结果</small><button class="q-link cursor-interaction" data-panel="terminal">查看输出</button></div>';}
else if(state.agent==='main'){html='<div class="q-user"><p>把从目标到完成的第一条路径接通。保留未来任务，完成必须有真实证据。</p></div><details class="q-fold" id="q-process"><summary class="cursor-interaction"><span class="q-chevron">›</span><span>已明确范围，正在接通完成链</span></summary><div class="q-foldbody"><div class="q-taskline"><span class="q-dot"></span><button class="cursor-interaction" data-node="behavior">明确行为与验收</button><small>完成</small></div><div class="q-taskline"><span class="q-dot running"></span><button class="cursor-interaction" data-node="completion">接通检查与完成链</button><small>进行中</small></div><div class="q-taskline"><span class="q-dot pending"></span><button class="cursor-interaction" data-node="entry">入口与结果展示</button><small>待细化</small></div></div></details><div class="q-assistant"><p>行为与验收要求已整理好。实现者正在连接检查与完成链，后续会根据真实检查结果继续推进。</p><p>尚未细化的工作会留在任务图中，不会因为当前没有可执行任务而被当作完成。</p></div>';}
else if(state.agent==='impl'){html='<div class="q-user"><p>目前进行到哪里了？</p></div><details class="q-fold" id="q-process"><summary class="cursor-interaction"><span class="q-chevron">›</span>已检查相关入口 · 2 项工具操作</summary><div class="q-foldbody"><div class="q-taskline"><button class="cursor-interaction" data-panel="files">读取完成条件</button></div><div class="q-taskline"><button class="cursor-interaction" data-panel="terminal">查看检查输出</button></div></div></details><div class="q-assistant"><p>已经找到执行结果与正式完成之间的连接点，正在补齐检查覆盖和来源核对。</p><p>检查还没有全部结束。目前保留“工作中”，不会提前标记完成。</p></div>';}
else if(state.agent==='old'){html='<p>此前调查记录已归档。</p><p class="q-subtle">可以继续查看历史与来源；重新启用后才能继续该会话。</p>';}
else{html='<div class="q-assistant"><p>'+(state.agent==='review'?'我可以帮助核对当前变更和完成证据。':'可以一起讨论模块职责、依赖和方案取舍。')+'</p><p class="q-subtle">当前待命。选择相关文件或直接发送问题即可。</p></div>';}
$('#q-chat').innerHTML=html;const fold=$('#q-process');if(fold){fold.open=foldOpen;fold.addEventListener('toggle',()=>{foldOpen=fold.open})}for(const text of messages[currentKey]||[]){const p=document.createElement('p');p.className='q-user';p.textContent=text;$('#q-chat').append(p)}icon();}
function node(id,label,status,cls){return '<li><button class="q-node cursor-interaction" data-node="'+id+'" aria-pressed="false"><span class="q-dot '+(cls||'')+'"></span><span>'+label+'</span>'+(status?'<small>'+status+'</small>':'')+'</button></li>';}

<style>

<style>
